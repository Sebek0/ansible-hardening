---
# docker role main entry

- name: Fail fast on unsupported OS family
  ansible.builtin.assert:
    that:
      - ansible_os_family in docker_supported_os_families
    fail_msg: >-
      docker role does not support {{ ansible_os_family }}.
      Supported families: {{ docker_supported_os_families | join(', ') }}
    quiet: true

- name: Gather package facts (used for idempotent version checks)
  ansible.builtin.package_facts:
    manager: auto

- name: Install Docker Engine and CLI
  ansible.builtin.include_tasks: "install-{{ ansible_os_family }}.yml"

- name: Ensure /etc/docker exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy daemon.json
  ansible.builtin.template:
    src: daemon.json.j2
    dest: "{{ docker_daemon_json_path }}"
    owner: root
    group: root
    mode: "0644"
    validate: "python3 -m json.tool %s"
  notify: Restart docker

- name: Configure Docker service proxy environment
  when: docker_use_proxy
  block:
    - name: Ensure systemd drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/docker.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy proxy drop-in
      ansible.builtin.template:
        src: http-proxy.conf.j2
        dest: /etc/systemd/system/docker.service.d/http-proxy.conf
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart docker

- name: Ensure docker group exists
  ansible.builtin.group:
    name: docker
    state: present

- name: Add users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"

- name: Enable and start Docker service
  ansible.builtin.systemd_service:
    name: "{{ docker_service_name }}"
    enabled: "{{ docker_service_enabled }}"
    state: "{{ docker_service_state }}"
    daemon_reload: true

- name: Set up scheduled docker system prune
  when: docker_prune_enabled
  ansible.builtin.include_tasks: prune-job.yml

- name: Verify Docker is functional
  ansible.builtin.command: docker version --format '{{ "{{.Server.Version}}" }}'
  register: _docker_version_check
  changed_when: false
  failed_when: _docker_version_check.rc != 0

- name: Report installed Docker version
  ansible.builtin.debug:
    msg: "Docker {{ _docker_version_check.stdout }} is installed and running on {{ inventory_hostname }}"

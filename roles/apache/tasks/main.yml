---
- name: Install apache
  ansible.builtin.apt:
    name: apache2
    state: present
    update_cache: true
  when:
    - install_apache | default(false)
    - ansible_facts['distribution'] in ['Ubuntu', 'Debian']

- name: Install httpd
  ansible.builtin.dnf:
    name: httpd
    state: present
    update_cache: true
  when:
    - install_apache | default(false)
    - ansible_facts['os_family'] == "RedHat"

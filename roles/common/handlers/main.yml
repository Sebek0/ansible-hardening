---
- name: restart sshd
  ansible.builtin.service:
    name: sshd
    state: restarted

- name: reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true
  
- name: restart journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted

- name: restart nftables
  ansible.builtin.systemd:
    name: nftables
    state: restarted